# Generated by scripts/build_spec.py — do not edit by hand.
# Connection: Centric Brands POC (82dc9446-e21c-4484-987d-79b52a490e2a)

name: Daily Ecom Recap — Email
description: Per-brand daily ecom recap, laid out to be sent as the morning email. One page per brand; each page is one send. Brand-owned website demand only (FD retail boutiques are reported separately on the FD page). Generated from code — edit sigma/sql + scripts/build_spec.py, not the canvas.
schemaVersion: "1"
sources:
  - id: src_hudson_header
    name: Hudson Jeans — header
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: brand header band + narrative paragraph + promo/email callout
      --               + the four KPI tiles + the data-freshness footnotes.
      -- Grain: exactly one row (brand x latest complete report date).
      --
      -- This block also owns the *copy*: the narrative sentences, the promo lines and
      -- the compact money/percent strings ("$12.8k", "-31%") are built here rather
      -- than assembled from formula chips in the workbook. Two reasons: the sentences
      -- stay byte-identical to the mails they replace, and the em-dash placeholder for
      -- a missing plan or promo is decided in one place instead of per element.
      --
      -- Report date is derived, not passed in: the send always shows the latest day
      -- present in TB_SIGMA_QA_GLANCE_BRAND for the brand, which is what the email's
      -- "ADF last complete day is <date> - showing that day until the pipeline
      -- catches up" note describes.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND
        WHERE BRAND_ID = 'hudson-jeans'
      ),
      g AS (
        SELECT g.*
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND g
        JOIN d ON g.REPORT_DATE = d.REPORT_DATE
        WHERE g.BRAND_ID = 'hudson-jeans'
      ),
      cfg AS (
        SELECT SITE_NOTE, HAS_SHOPIFY_RETAIL
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_SIGMA_BRAND_CONFIG
        WHERE BRAND_ID = 'hudson-jeans'
      ),
      -- Month-to-date plan: summed from the daily plan rows up to the report date.
      -- The month total on the glance table is the full-month plan.
      mtd_plan AS (
        SELECT COALESCE(SUM(p.DEMAND_PLAN_AMT), 0) AS MTD_DEMAND_PLAN
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_SALES_PLAN p
        CROSS JOIN d
        WHERE p.BRAND_ID = 'hudson-jeans'
          AND p.PLAN_DATE BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      promo AS (
        SELECT MAX(pr.PROMO_TEXT) AS PROMO_TEXT,
               MAX(pr.EMAIL_TEXT)  AS EMAIL_TEXT
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_PROMO pr
        CROSS JOIN d
        WHERE pr.BRAND_ID = 'hudson-jeans'
          AND pr.PROMO_DATE = d.REPORT_DATE
      ),
      -- Latest record per Shopify order, so TOTALDISCOUNT is read off the same row
      -- the demand figures come from (mirrors VW_SIGMA_LATEST_ORDERS).
      orders_latest AS (
        SELECT o.ID AS ORDER_ID, o.BRANDID AS BRAND_ID, o.TOTALDISCOUNT
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDERS_ADF o
        WHERE o.BRANDID = 'hudson-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY o.BRANDID, o.ID
          ORDER BY o.UPDATEDAT DESC NULLS LAST, o.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      -- "Promo purchase (discounts applied)" - discount dollars and the number of
      -- discounted orders, restricted to the same in-scope ecom orders as demand.
      promo_purchase AS (
        SELECT COALESCE(SUM(ol.TOTALDISCOUNT), 0)                          AS PROMO_PURCHASE_AMT,
               COUNT(DISTINCT IFF(ol.TOTALDISCOUNT > 0, f.ORDER_ID, NULL)) AS PROMO_PURCHASE_ORDERS
        FROM SANDBOX.SBX_RRAJASEKAR.VW_SIGMA_ORDERS_FILTERED f
        JOIN d ON f.DT_PT = d.REPORT_DATE
        LEFT JOIN orders_latest ol
               ON ol.ORDER_ID = f.ORDER_ID
              AND ol.BRAND_ID = f.BRAND_ID
        WHERE f.BRAND_ID = 'hudson-jeans'
      ),
      -- Drives the two data-freshness footnotes above the top-10 block: whether any
      -- Shopify refunds landed for the report date, and which day the order feed is
      -- actually complete through.
      refunds AS (
        SELECT COUNT(*) AS REFUND_ROWS_TODAY
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_TOP_RETURNS r
        CROSS JOIN d
        WHERE r.BRAND_ID = 'hudson-jeans'
          AND r.DT_PT = d.REPORT_DATE
      ),
      feed AS (
        SELECT MAX(DT_PT) AS LAST_COMPLETE_DAY
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES
        WHERE BRAND_ID = 'hudson-jeans'
      ),
      -- Yesterday's retail contribution, quoted in the FD note above the KPI tiles.
      retail AS (
        SELECT MAX(IFF(c.CHANNEL = 'Retail (POS / boutiques)', c.Y_DEMAND, NULL)) AS RETAIL_Y_DEMAND,
               MAX(IFF(c.CHANNEL = 'Retail (POS / boutiques)', c.Y_ORDERS, NULL)) AS RETAIL_Y_ORDERS
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_CHANNEL_FD c
        CROSS JOIN d
        WHERE c.REPORT_DATE = d.REPORT_DATE
      ),
      raw AS (
        SELECT
          g.BRAND_ID,
          g.BRAND_LABEL,
          cfg.SITE_NOTE,
          cfg.HAS_SHOPIFY_RETAIL,
          g.REPORT_DATE,
          DATEADD('day', -364, g.REPORT_DATE) AS SAME_DAY_LY_DATE,
          g.YESTERDAY_DEMAND,
          g.Y_DEMAND_PLAN,
          g.PCT_YEST_VS_PLAN,
          g.SAME_DAY_LY_DEMAND,
          g.PCT_YEST_VS_LY,
          g.MTD_DEMAND,
          mp.MTD_DEMAND_PLAN,
          g.TOTAL_MONTH_PLAN,
          g.PCT_MTD_VS_PLAN,
          g.LY_MTD_DEMAND,
          g.PCT_MTD_VS_LY,
          g.PCT_PLAN_ACHIEVED,
          g.TO_GO_VS_PLAN,
          promo.PROMO_TEXT,
          promo.EMAIL_TEXT,
          pp.PROMO_PURCHASE_AMT,
          pp.PROMO_PURCHASE_ORDERS,
          rf.REFUND_ROWS_TODAY,
          fd.LAST_COMPLETE_DAY,
          rt.RETAIL_Y_DEMAND,
          rt.RETAIL_Y_ORDERS,
          g.AS_OF_DATE
        FROM g
        CROSS JOIN cfg
        CROSS JOIN mtd_plan mp
        CROSS JOIN promo
        CROSS JOIN promo_purchase pp
        CROSS JOIN refunds rf
        CROSS JOIN feed fd
        CROSS JOIN retail rt
      ),
      -- Display strings. Money is compact ($12.8k / $1.2m) the way the mail prints
      -- it; percentages are whole numbers carrying an explicit sign; anything missing
      -- becomes an em dash rather than "0" or "null".
      fmt AS (
        SELECT
          r.*,
          DECODE(DAYOFWEEK(r.REPORT_DATE), 0,'Sunday',1,'Monday',2,'Tuesday',3,'Wednesday',
                 4,'Thursday',5,'Friday',6,'Saturday')
            || ', ' || MONTH(r.REPORT_DATE) || '/' || DAY(r.REPORT_DATE)
            || '/' || RIGHT(YEAR(r.REPORT_DATE)::string, 2)                       AS REPORT_DATE_LABEL,
          DECODE(DAYOFWEEK(r.SAME_DAY_LY_DATE), 0,'Sunday',1,'Monday',2,'Tuesday',3,'Wednesday',
                 4,'Thursday',5,'Friday',6,'Saturday')
            || ', ' || MONTH(r.SAME_DAY_LY_DATE) || '/' || DAY(r.SAME_DAY_LY_DATE)
            || '/' || RIGHT(YEAR(r.SAME_DAY_LY_DATE)::string, 2)                  AS SAME_DAY_LY_LABEL,

          IFF(r.YESTERDAY_DEMAND IS NULL, '—', IFF(r.YESTERDAY_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.YESTERDAY_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.YESTERDAY_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND), 0)) END)   AS YESTERDAY_DEMAND_FMT,
          IFF(r.Y_DEMAND_PLAN IS NULL, '—', IFF(r.Y_DEMAND_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.Y_DEMAND_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.Y_DEMAND_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN), 0)) END)      AS Y_DEMAND_PLAN_FMT,
          IFF(r.SAME_DAY_LY_DEMAND IS NULL, '—', IFF(r.SAME_DAY_LY_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.SAME_DAY_LY_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.SAME_DAY_LY_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND), 0)) END) AS SAME_DAY_LY_DEMAND_FMT,
          IFF(r.MTD_DEMAND IS NULL, '—', IFF(r.MTD_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.MTD_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.MTD_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND), 0)) END)         AS MTD_DEMAND_FMT,
          IFF(r.MTD_DEMAND_PLAN IS NULL, '—', IFF(r.MTD_DEMAND_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.MTD_DEMAND_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.MTD_DEMAND_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN), 0)) END)    AS MTD_DEMAND_PLAN_FMT,
          IFF(r.TOTAL_MONTH_PLAN IS NULL, '—', IFF(r.TOTAL_MONTH_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.TOTAL_MONTH_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.TOTAL_MONTH_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN), 0)) END)   AS TOTAL_MONTH_PLAN_FMT,
          IFF(r.LY_MTD_DEMAND IS NULL, '—', IFF(r.LY_MTD_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.LY_MTD_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.LY_MTD_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND), 0)) END)      AS LY_MTD_DEMAND_FMT,
          IFF(r.TO_GO_VS_PLAN IS NULL, '—', IFF(r.TO_GO_VS_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.TO_GO_VS_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.TO_GO_VS_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN), 0)) END)      AS TO_GO_VS_PLAN_FMT,
          IFF(r.PROMO_PURCHASE_AMT IS NULL, '—', IFF(r.PROMO_PURCHASE_AMT < 0, '-', '') || '$' || CASE WHEN ABS(r.PROMO_PURCHASE_AMT) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT) / 1000000.0, 1)) || 'm' WHEN ABS(r.PROMO_PURCHASE_AMT) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT), 0)) END) AS PROMO_PURCHASE_AMT_FMT,
          IFF(r.RETAIL_Y_DEMAND IS NULL, '—', IFF(r.RETAIL_Y_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.RETAIL_Y_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.RETAIL_Y_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND), 0)) END)    AS RETAIL_Y_DEMAND_FMT,

          IFF(r.PCT_YEST_VS_PLAN IS NULL, '—', IFF(r.PCT_YEST_VS_PLAN >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_YEST_VS_PLAN) * 100, 0)) || '%')     AS PCT_YEST_VS_PLAN_FMT,
          IFF(r.PCT_YEST_VS_LY IS NULL, '—', IFF(r.PCT_YEST_VS_LY >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_YEST_VS_LY) * 100, 0)) || '%')       AS PCT_YEST_VS_LY_FMT,
          IFF(r.PCT_MTD_VS_PLAN IS NULL, '—', IFF(r.PCT_MTD_VS_PLAN >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_MTD_VS_PLAN) * 100, 0)) || '%')      AS PCT_MTD_VS_PLAN_FMT,
          IFF(r.PCT_MTD_VS_LY IS NULL, '—', IFF(r.PCT_MTD_VS_LY >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_MTD_VS_LY) * 100, 0)) || '%')        AS PCT_MTD_VS_LY_FMT,
          -- Unsigned: "80%" of plan achieved, not "+80%".
          IFF(r.PCT_PLAN_ACHIEVED IS NULL, '—', TO_VARCHAR(ROUND(r.PCT_PLAN_ACHIEVED * 100, 0)) || '%') AS PCT_PLAN_ACHIEVED_FMT
        FROM raw r
      )
      SELECT
        f.*,

        -- Header band
        'Today = ' || f.REPORT_DATE_LABEL                                          AS HEADER_TODAY_LINE,
        'Same Day LY = ' || f.SAME_DAY_LY_LABEL || ' (same weekday)'               AS HEADER_LY_LINE,

        -- Narrative paragraph
        'Yesterday''s ecom demand was ' || f.YESTERDAY_DEMAND_FMT
          || ' vs plan ' || f.Y_DEMAND_PLAN_FMT
          || ' (' || f.PCT_YEST_VS_PLAN_FMT || ') and '
          || f.PCT_YEST_VS_LY_FMT || ' to same-day LY.'                            AS NARRATIVE_YESTERDAY,
        'MTD ecom demand is ' || f.MTD_DEMAND_FMT
          || ' vs MTD plan ' || f.MTD_DEMAND_PLAN_FMT
          || ' / month plan ' || f.TOTAL_MONTH_PLAN_FMT
          || ' (' || f.PCT_MTD_VS_PLAN_FMT || ' to MTD plan, '
          || f.PCT_MTD_VS_LY_FMT || ' to LY MTD).'                                 AS NARRATIVE_MTD,

        -- The small print under each of the four tiles, e.g.
        -- "$12.8k vs $14.3k plan" / "vs $18.5k" / "vs $49.4k LY MTD".
        f.YESTERDAY_DEMAND_FMT || ' vs ' || f.Y_DEMAND_PLAN_FMT || ' plan'          AS TILE_Y_PLAN_SUB,
        'vs ' || f.SAME_DAY_LY_DEMAND_FMT                                          AS TILE_Y_LY_SUB,
        f.MTD_DEMAND_FMT || ' vs ' || f.MTD_DEMAND_PLAN_FMT
          || ' MTD plan (month ' || f.TOTAL_MONTH_PLAN_FMT || ')'                   AS TILE_MTD_PLAN_SUB,
        'vs ' || f.LY_MTD_DEMAND_FMT || ' LY MTD'                                  AS TILE_MTD_LY_SUB,

        -- Promo & email callout
        IFF(COALESCE(TRIM(f.PROMO_TEXT), '') = '',
            '— (none on Marketing Calendar for this day)',
            f.PROMO_TEXT)                                                          AS PROMO_LINE,
        IFF(COALESCE(TRIM(f.EMAIL_TEXT), '') = '',
            '— (none on Marketing Calendar for this day)',
            f.EMAIL_TEXT)                                                          AS EMAIL_LINE,
        f.PROMO_PURCHASE_AMT_FMT || ' across ' || f.PROMO_PURCHASE_ORDERS
          || ' orders (Shopify TOTALDISCOUNT)'                                     AS PROMO_PURCHASE_LINE,

        -- FD-only note above the KPI tiles
        IFF(f.HAS_SHOPIFY_RETAIL AND f.RETAIL_Y_DEMAND IS NOT NULL,
            'Retail boutiques added ' || f.RETAIL_Y_DEMAND_FMT || ' / '
              || f.RETAIL_Y_ORDERS || ' orders yesterday — see Retail + Total DTC '
              || 'below. Not included in the ecom figures above.',
            NULL)                                                                  AS RETAIL_NOTE_LINE,

        -- Data-freshness footnotes above the top-10 block
        IFF(f.REFUND_ROWS_TODAY = 0,
            'No Shopify refunds in Snowflake for yesterday ('
              || f.REPORT_DATE::string || ' PT).',
            NULL)                                                                  AS REFUND_NOTE_LINE,
        'ADF last complete day is ' || f.LAST_COMPLETE_DAY::string
          || ' — showing that day until the pipeline catches up.'                  AS FEED_NOTE_LINE,
        'As of ' || f.AS_OF_DATE::string || ' PT.'                                 AS AS_OF_LINE
      FROM fmt f
  - id: src_hudson_perf
    name: Hudson Jeans — performance grid
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Performance detail - ecom only".
      -- Grain: one row per KPI, in the email's row order:
      --   Demand Sales, Demand Plan, Orders, Units, UPT, AOV, AUR.
      --
      -- Two shape corrections against TB_SIGMA_QA_KPI_LONG_BRAND:
      --   * It has no "Demand Plan" row, so that row is assembled from the daily plan
      --     table (yesterday plan, MTD plan, full-month plan) the way the email prints
      --     it - LY columns intentionally blank.
      --   * It carries seven metrics that are not in Snowflake yet (Media Spend,
      --     CAC/CPO, Traffic, CVR, Net Sales, Margin $, Margin %) and would render as
      --     seven empty rows. They are excluded here; the email covers them in the
      --     "KPI additions in progress" footnote instead.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_KPI_LONG_BRAND
        WHERE BRAND_ID = 'hudson-jeans'
      ),
      g AS (
        SELECT g.*
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND g
        JOIN d ON g.REPORT_DATE = d.REPORT_DATE
        WHERE g.BRAND_ID = 'hudson-jeans'
      ),
      mtd_plan AS (
        SELECT COALESCE(SUM(p.DEMAND_PLAN_AMT), 0) AS MTD_DEMAND_PLAN
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_SALES_PLAN p
        CROSS JOIN d
        WHERE p.BRAND_ID = 'hudson-jeans'
          AND p.PLAN_DATE BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      base AS (
        SELECT
          k.METRIC_SORT::number(9, 1)      AS METRIC_SORT,
          k.METRIC                         AS METRIC,
          k.YESTERDAY::number(38, 8)       AS YESTERDAY,
          k.SAME_DAY_LY::number(38, 8)     AS SAME_DAY_LY,
          k.MTD::number(38, 8)             AS MTD,
          k.LY_MTD::number(38, 8)          AS LY_MTD,
          k.TOTAL_MONTH_PLAN::number(38, 2) AS TOTAL_MONTH_PLAN,
          k.TO_GO_VS_PLAN::number(38, 2)   AS TO_GO_VS_PLAN,
          k.PCT_PLAN_ACHIEVED::number(38, 8) AS PCT_PLAN_ACHIEVED,
          k.REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_KPI_LONG_BRAND k
        JOIN d ON k.REPORT_DATE = d.REPORT_DATE
        WHERE k.BRAND_ID = 'hudson-jeans'
          AND k.METRIC_SORT <= 6
      ),
      plan_row AS (
        SELECT
          1.5::number(9, 1)                       AS METRIC_SORT,
          'Demand Plan'                           AS METRIC,
          g.Y_DEMAND_PLAN::number(38, 8)          AS YESTERDAY,
          NULL::number(38, 8)                     AS SAME_DAY_LY,
          mp.MTD_DEMAND_PLAN::number(38, 8)       AS MTD,
          NULL::number(38, 8)                     AS LY_MTD,
          g.TOTAL_MONTH_PLAN::number(38, 2)       AS TOTAL_MONTH_PLAN,
          NULL::number(38, 2)                     AS TO_GO_VS_PLAN,
          NULL::number(38, 8)                     AS PCT_PLAN_ACHIEVED,
          g.REPORT_DATE
        FROM g
        CROSS JOIN mtd_plan mp
      )
      SELECT * FROM base
      UNION ALL
      SELECT * FROM plan_row
      ORDER BY METRIC_SORT
  - id: src_hudson_top_sold
    name: Hudson Jeans — top 10 sold
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 10 sold" (yesterday, ecom).
      -- Units and dollars come straight from the validated pipeline table so the
      -- workbook and the existing QA workbook always agree; only the product image
      -- is joined on here.
      --
      -- Image resolution: order line -> Shopify product -> featuredImageUrl, keyed on
      -- style + color. Colour sits in a different slot of VARIANTTITLE per brand
      -- (FD/Hudson "colour / size", Joe's "size / COLOUR"), so the size-shaped part is
      -- discarded rather than assuming a position. This reproduces the image URLs on
      -- TB_SIGMA_TOP_STYLES_CURR exactly for all 30 current rows across the 3 brands.
      WITH d AS (
        SELECT MAX(DT_PT) AS DT_PT
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES
        WHERE BRAND_ID = 'hudson-jeans'
      ),
      items AS (
        SELECT i.BRANDID AS BRAND_ID, i.PRODUCTID, i.PRODUCTTITLE, i.VARIANTTITLE, i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'hudson-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'hudson-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      keyed AS (
        SELECT
          i.BRAND_ID,
          i.PRODUCTID,
          i.LOADTIMESTAMP,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2)))
            ELSE UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1)))
          END AS COLOR_K
        FROM items i
      ),
      img AS (
        SELECT k.BRAND_ID, k.STYLE_K, k.COLOR_K,
               MAX_BY(pr.IMAGE_URL, k.LOADTIMESTAMP) AS IMAGE_URL
        FROM keyed k
        JOIN prod pr ON pr.PRODUCT_ID = k.PRODUCTID AND pr.BRAND_ID = k.BRAND_ID
        WHERE pr.IMAGE_URL IS NOT NULL
        GROUP BY 1, 2, 3
      )
      SELECT
        t.RANK_IN_DAY,
        t.STYLE,
        t.COLOR,
        t.STYLE || ' — ' || t.COLOR AS STYLE_COLOR,
        t.QTY,
        t.DEMAND_AMT,
        img.IMAGE_URL,
        t.DT_PT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES t
      JOIN d ON t.DT_PT = d.DT_PT
      LEFT JOIN img
             ON img.BRAND_ID = t.BRAND_ID
            AND img.STYLE_K  = UPPER(TRIM(t.STYLE))
            AND img.COLOR_K  = UPPER(TRIM(t.COLOR))
      WHERE t.BRAND_ID = 'hudson-jeans'
        AND t.RANK_IN_DAY <= 10
      ORDER BY t.RANK_IN_DAY
  - id: src_hudson_top_returned
    name: Hudson Jeans — top 10 returned
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 10 returned" (yesterday, ecom).
      -- Shopify refunds only - Loop return rate / status is not in Snowflake yet
      -- (see TB_SIGMA_SOURCE_MAP).
      --
      -- The report date is taken from the glance table, i.e. the same day the rest of
      -- the email reports on - deliberately NOT the latest day that happens to have
      -- refund rows. Refunds lag the order feed, so keying off the refund table would
      -- silently pair one day's KPIs with an older day's returns. When there are no
      -- refunds for the report date this returns no rows, which is the email's
      -- "No rows for this day." state.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS DT_PT
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND
        WHERE BRAND_ID = 'hudson-jeans'
      ),
      items AS (
        SELECT i.BRANDID AS BRAND_ID, i.PRODUCTID, i.PRODUCTTITLE, i.VARIANTTITLE, i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'hudson-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'hudson-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      keyed AS (
        SELECT
          i.BRAND_ID,
          i.PRODUCTID,
          i.LOADTIMESTAMP,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2)))
            ELSE UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1)))
          END AS COLOR_K
        FROM items i
      ),
      img AS (
        SELECT k.BRAND_ID, k.STYLE_K, k.COLOR_K,
               MAX_BY(pr.IMAGE_URL, k.LOADTIMESTAMP) AS IMAGE_URL
        FROM keyed k
        JOIN prod pr ON pr.PRODUCT_ID = k.PRODUCTID AND pr.BRAND_ID = k.BRAND_ID
        WHERE pr.IMAGE_URL IS NOT NULL
        GROUP BY 1, 2, 3
      )
      SELECT
        r.RANK_IN_DAY,
        r.STYLE,
        r.COLOR,
        r.STYLE || ' — ' || r.COLOR AS STYLE_COLOR,
        r.QTY,
        img.IMAGE_URL,
        r.DT_PT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_TOP_RETURNS r
      JOIN d ON r.DT_PT = d.DT_PT
      LEFT JOIN img
             ON img.BRAND_ID = r.BRAND_ID
            AND img.STYLE_K  = UPPER(TRIM(r.STYLE))
            AND img.COLOR_K  = UPPER(TRIM(r.COLOR))
      WHERE r.BRAND_ID = 'hudson-jeans'
        AND r.RANK_IN_DAY <= 10
      ORDER BY r.RANK_IN_DAY
  - id: src_favorite_daughter_header
    name: Favorite Daughter — header
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: brand header band + narrative paragraph + promo/email callout
      --               + the four KPI tiles + the data-freshness footnotes.
      -- Grain: exactly one row (brand x latest complete report date).
      --
      -- This block also owns the *copy*: the narrative sentences, the promo lines and
      -- the compact money/percent strings ("$12.8k", "-31%") are built here rather
      -- than assembled from formula chips in the workbook. Two reasons: the sentences
      -- stay byte-identical to the mails they replace, and the em-dash placeholder for
      -- a missing plan or promo is decided in one place instead of per element.
      --
      -- Report date is derived, not passed in: the send always shows the latest day
      -- present in TB_SIGMA_QA_GLANCE_BRAND for the brand, which is what the email's
      -- "ADF last complete day is <date> - showing that day until the pipeline
      -- catches up" note describes.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND
        WHERE BRAND_ID = 'favorite-daughter'
      ),
      g AS (
        SELECT g.*
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND g
        JOIN d ON g.REPORT_DATE = d.REPORT_DATE
        WHERE g.BRAND_ID = 'favorite-daughter'
      ),
      cfg AS (
        SELECT SITE_NOTE, HAS_SHOPIFY_RETAIL
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_SIGMA_BRAND_CONFIG
        WHERE BRAND_ID = 'favorite-daughter'
      ),
      -- Month-to-date plan: summed from the daily plan rows up to the report date.
      -- The month total on the glance table is the full-month plan.
      mtd_plan AS (
        SELECT COALESCE(SUM(p.DEMAND_PLAN_AMT), 0) AS MTD_DEMAND_PLAN
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_SALES_PLAN p
        CROSS JOIN d
        WHERE p.BRAND_ID = 'favorite-daughter'
          AND p.PLAN_DATE BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      promo AS (
        SELECT MAX(pr.PROMO_TEXT) AS PROMO_TEXT,
               MAX(pr.EMAIL_TEXT)  AS EMAIL_TEXT
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_PROMO pr
        CROSS JOIN d
        WHERE pr.BRAND_ID = 'favorite-daughter'
          AND pr.PROMO_DATE = d.REPORT_DATE
      ),
      -- Latest record per Shopify order, so TOTALDISCOUNT is read off the same row
      -- the demand figures come from (mirrors VW_SIGMA_LATEST_ORDERS).
      orders_latest AS (
        SELECT o.ID AS ORDER_ID, o.BRANDID AS BRAND_ID, o.TOTALDISCOUNT
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDERS_ADF o
        WHERE o.BRANDID = 'favorite-daughter'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY o.BRANDID, o.ID
          ORDER BY o.UPDATEDAT DESC NULLS LAST, o.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      -- "Promo purchase (discounts applied)" - discount dollars and the number of
      -- discounted orders, restricted to the same in-scope ecom orders as demand.
      promo_purchase AS (
        SELECT COALESCE(SUM(ol.TOTALDISCOUNT), 0)                          AS PROMO_PURCHASE_AMT,
               COUNT(DISTINCT IFF(ol.TOTALDISCOUNT > 0, f.ORDER_ID, NULL)) AS PROMO_PURCHASE_ORDERS
        FROM SANDBOX.SBX_RRAJASEKAR.VW_SIGMA_ORDERS_FILTERED f
        JOIN d ON f.DT_PT = d.REPORT_DATE
        LEFT JOIN orders_latest ol
               ON ol.ORDER_ID = f.ORDER_ID
              AND ol.BRAND_ID = f.BRAND_ID
        WHERE f.BRAND_ID = 'favorite-daughter'
      ),
      -- Drives the two data-freshness footnotes above the top-10 block: whether any
      -- Shopify refunds landed for the report date, and which day the order feed is
      -- actually complete through.
      refunds AS (
        SELECT COUNT(*) AS REFUND_ROWS_TODAY
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_TOP_RETURNS r
        CROSS JOIN d
        WHERE r.BRAND_ID = 'favorite-daughter'
          AND r.DT_PT = d.REPORT_DATE
      ),
      feed AS (
        SELECT MAX(DT_PT) AS LAST_COMPLETE_DAY
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES
        WHERE BRAND_ID = 'favorite-daughter'
      ),
      -- Yesterday's retail contribution, quoted in the FD note above the KPI tiles.
      retail AS (
        SELECT MAX(IFF(c.CHANNEL = 'Retail (POS / boutiques)', c.Y_DEMAND, NULL)) AS RETAIL_Y_DEMAND,
               MAX(IFF(c.CHANNEL = 'Retail (POS / boutiques)', c.Y_ORDERS, NULL)) AS RETAIL_Y_ORDERS
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_CHANNEL_FD c
        CROSS JOIN d
        WHERE c.REPORT_DATE = d.REPORT_DATE
      ),
      raw AS (
        SELECT
          g.BRAND_ID,
          g.BRAND_LABEL,
          cfg.SITE_NOTE,
          cfg.HAS_SHOPIFY_RETAIL,
          g.REPORT_DATE,
          DATEADD('day', -364, g.REPORT_DATE) AS SAME_DAY_LY_DATE,
          g.YESTERDAY_DEMAND,
          g.Y_DEMAND_PLAN,
          g.PCT_YEST_VS_PLAN,
          g.SAME_DAY_LY_DEMAND,
          g.PCT_YEST_VS_LY,
          g.MTD_DEMAND,
          mp.MTD_DEMAND_PLAN,
          g.TOTAL_MONTH_PLAN,
          g.PCT_MTD_VS_PLAN,
          g.LY_MTD_DEMAND,
          g.PCT_MTD_VS_LY,
          g.PCT_PLAN_ACHIEVED,
          g.TO_GO_VS_PLAN,
          promo.PROMO_TEXT,
          promo.EMAIL_TEXT,
          pp.PROMO_PURCHASE_AMT,
          pp.PROMO_PURCHASE_ORDERS,
          rf.REFUND_ROWS_TODAY,
          fd.LAST_COMPLETE_DAY,
          rt.RETAIL_Y_DEMAND,
          rt.RETAIL_Y_ORDERS,
          g.AS_OF_DATE
        FROM g
        CROSS JOIN cfg
        CROSS JOIN mtd_plan mp
        CROSS JOIN promo
        CROSS JOIN promo_purchase pp
        CROSS JOIN refunds rf
        CROSS JOIN feed fd
        CROSS JOIN retail rt
      ),
      -- Display strings. Money is compact ($12.8k / $1.2m) the way the mail prints
      -- it; percentages are whole numbers carrying an explicit sign; anything missing
      -- becomes an em dash rather than "0" or "null".
      fmt AS (
        SELECT
          r.*,
          DECODE(DAYOFWEEK(r.REPORT_DATE), 0,'Sunday',1,'Monday',2,'Tuesday',3,'Wednesday',
                 4,'Thursday',5,'Friday',6,'Saturday')
            || ', ' || MONTH(r.REPORT_DATE) || '/' || DAY(r.REPORT_DATE)
            || '/' || RIGHT(YEAR(r.REPORT_DATE)::string, 2)                       AS REPORT_DATE_LABEL,
          DECODE(DAYOFWEEK(r.SAME_DAY_LY_DATE), 0,'Sunday',1,'Monday',2,'Tuesday',3,'Wednesday',
                 4,'Thursday',5,'Friday',6,'Saturday')
            || ', ' || MONTH(r.SAME_DAY_LY_DATE) || '/' || DAY(r.SAME_DAY_LY_DATE)
            || '/' || RIGHT(YEAR(r.SAME_DAY_LY_DATE)::string, 2)                  AS SAME_DAY_LY_LABEL,

          IFF(r.YESTERDAY_DEMAND IS NULL, '—', IFF(r.YESTERDAY_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.YESTERDAY_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.YESTERDAY_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND), 0)) END)   AS YESTERDAY_DEMAND_FMT,
          IFF(r.Y_DEMAND_PLAN IS NULL, '—', IFF(r.Y_DEMAND_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.Y_DEMAND_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.Y_DEMAND_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN), 0)) END)      AS Y_DEMAND_PLAN_FMT,
          IFF(r.SAME_DAY_LY_DEMAND IS NULL, '—', IFF(r.SAME_DAY_LY_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.SAME_DAY_LY_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.SAME_DAY_LY_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND), 0)) END) AS SAME_DAY_LY_DEMAND_FMT,
          IFF(r.MTD_DEMAND IS NULL, '—', IFF(r.MTD_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.MTD_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.MTD_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND), 0)) END)         AS MTD_DEMAND_FMT,
          IFF(r.MTD_DEMAND_PLAN IS NULL, '—', IFF(r.MTD_DEMAND_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.MTD_DEMAND_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.MTD_DEMAND_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN), 0)) END)    AS MTD_DEMAND_PLAN_FMT,
          IFF(r.TOTAL_MONTH_PLAN IS NULL, '—', IFF(r.TOTAL_MONTH_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.TOTAL_MONTH_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.TOTAL_MONTH_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN), 0)) END)   AS TOTAL_MONTH_PLAN_FMT,
          IFF(r.LY_MTD_DEMAND IS NULL, '—', IFF(r.LY_MTD_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.LY_MTD_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.LY_MTD_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND), 0)) END)      AS LY_MTD_DEMAND_FMT,
          IFF(r.TO_GO_VS_PLAN IS NULL, '—', IFF(r.TO_GO_VS_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.TO_GO_VS_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.TO_GO_VS_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN), 0)) END)      AS TO_GO_VS_PLAN_FMT,
          IFF(r.PROMO_PURCHASE_AMT IS NULL, '—', IFF(r.PROMO_PURCHASE_AMT < 0, '-', '') || '$' || CASE WHEN ABS(r.PROMO_PURCHASE_AMT) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT) / 1000000.0, 1)) || 'm' WHEN ABS(r.PROMO_PURCHASE_AMT) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT), 0)) END) AS PROMO_PURCHASE_AMT_FMT,
          IFF(r.RETAIL_Y_DEMAND IS NULL, '—', IFF(r.RETAIL_Y_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.RETAIL_Y_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.RETAIL_Y_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND), 0)) END)    AS RETAIL_Y_DEMAND_FMT,

          IFF(r.PCT_YEST_VS_PLAN IS NULL, '—', IFF(r.PCT_YEST_VS_PLAN >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_YEST_VS_PLAN) * 100, 0)) || '%')     AS PCT_YEST_VS_PLAN_FMT,
          IFF(r.PCT_YEST_VS_LY IS NULL, '—', IFF(r.PCT_YEST_VS_LY >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_YEST_VS_LY) * 100, 0)) || '%')       AS PCT_YEST_VS_LY_FMT,
          IFF(r.PCT_MTD_VS_PLAN IS NULL, '—', IFF(r.PCT_MTD_VS_PLAN >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_MTD_VS_PLAN) * 100, 0)) || '%')      AS PCT_MTD_VS_PLAN_FMT,
          IFF(r.PCT_MTD_VS_LY IS NULL, '—', IFF(r.PCT_MTD_VS_LY >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_MTD_VS_LY) * 100, 0)) || '%')        AS PCT_MTD_VS_LY_FMT,
          -- Unsigned: "80%" of plan achieved, not "+80%".
          IFF(r.PCT_PLAN_ACHIEVED IS NULL, '—', TO_VARCHAR(ROUND(r.PCT_PLAN_ACHIEVED * 100, 0)) || '%') AS PCT_PLAN_ACHIEVED_FMT
        FROM raw r
      )
      SELECT
        f.*,

        -- Header band
        'Today = ' || f.REPORT_DATE_LABEL                                          AS HEADER_TODAY_LINE,
        'Same Day LY = ' || f.SAME_DAY_LY_LABEL || ' (same weekday)'               AS HEADER_LY_LINE,

        -- Narrative paragraph
        'Yesterday''s ecom demand was ' || f.YESTERDAY_DEMAND_FMT
          || ' vs plan ' || f.Y_DEMAND_PLAN_FMT
          || ' (' || f.PCT_YEST_VS_PLAN_FMT || ') and '
          || f.PCT_YEST_VS_LY_FMT || ' to same-day LY.'                            AS NARRATIVE_YESTERDAY,
        'MTD ecom demand is ' || f.MTD_DEMAND_FMT
          || ' vs MTD plan ' || f.MTD_DEMAND_PLAN_FMT
          || ' / month plan ' || f.TOTAL_MONTH_PLAN_FMT
          || ' (' || f.PCT_MTD_VS_PLAN_FMT || ' to MTD plan, '
          || f.PCT_MTD_VS_LY_FMT || ' to LY MTD).'                                 AS NARRATIVE_MTD,

        -- The small print under each of the four tiles, e.g.
        -- "$12.8k vs $14.3k plan" / "vs $18.5k" / "vs $49.4k LY MTD".
        f.YESTERDAY_DEMAND_FMT || ' vs ' || f.Y_DEMAND_PLAN_FMT || ' plan'          AS TILE_Y_PLAN_SUB,
        'vs ' || f.SAME_DAY_LY_DEMAND_FMT                                          AS TILE_Y_LY_SUB,
        f.MTD_DEMAND_FMT || ' vs ' || f.MTD_DEMAND_PLAN_FMT
          || ' MTD plan (month ' || f.TOTAL_MONTH_PLAN_FMT || ')'                   AS TILE_MTD_PLAN_SUB,
        'vs ' || f.LY_MTD_DEMAND_FMT || ' LY MTD'                                  AS TILE_MTD_LY_SUB,

        -- Promo & email callout
        IFF(COALESCE(TRIM(f.PROMO_TEXT), '') = '',
            '— (none on Marketing Calendar for this day)',
            f.PROMO_TEXT)                                                          AS PROMO_LINE,
        IFF(COALESCE(TRIM(f.EMAIL_TEXT), '') = '',
            '— (none on Marketing Calendar for this day)',
            f.EMAIL_TEXT)                                                          AS EMAIL_LINE,
        f.PROMO_PURCHASE_AMT_FMT || ' across ' || f.PROMO_PURCHASE_ORDERS
          || ' orders (Shopify TOTALDISCOUNT)'                                     AS PROMO_PURCHASE_LINE,

        -- FD-only note above the KPI tiles
        IFF(f.HAS_SHOPIFY_RETAIL AND f.RETAIL_Y_DEMAND IS NOT NULL,
            'Retail boutiques added ' || f.RETAIL_Y_DEMAND_FMT || ' / '
              || f.RETAIL_Y_ORDERS || ' orders yesterday — see Retail + Total DTC '
              || 'below. Not included in the ecom figures above.',
            NULL)                                                                  AS RETAIL_NOTE_LINE,

        -- Data-freshness footnotes above the top-10 block
        IFF(f.REFUND_ROWS_TODAY = 0,
            'No Shopify refunds in Snowflake for yesterday ('
              || f.REPORT_DATE::string || ' PT).',
            NULL)                                                                  AS REFUND_NOTE_LINE,
        'ADF last complete day is ' || f.LAST_COMPLETE_DAY::string
          || ' — showing that day until the pipeline catches up.'                  AS FEED_NOTE_LINE,
        'As of ' || f.AS_OF_DATE::string || ' PT.'                                 AS AS_OF_LINE
      FROM fmt f
  - id: src_favorite_daughter_perf
    name: Favorite Daughter — performance grid
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Performance detail - ecom only".
      -- Grain: one row per KPI, in the email's row order:
      --   Demand Sales, Demand Plan, Orders, Units, UPT, AOV, AUR.
      --
      -- Two shape corrections against TB_SIGMA_QA_KPI_LONG_BRAND:
      --   * It has no "Demand Plan" row, so that row is assembled from the daily plan
      --     table (yesterday plan, MTD plan, full-month plan) the way the email prints
      --     it - LY columns intentionally blank.
      --   * It carries seven metrics that are not in Snowflake yet (Media Spend,
      --     CAC/CPO, Traffic, CVR, Net Sales, Margin $, Margin %) and would render as
      --     seven empty rows. They are excluded here; the email covers them in the
      --     "KPI additions in progress" footnote instead.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_KPI_LONG_BRAND
        WHERE BRAND_ID = 'favorite-daughter'
      ),
      g AS (
        SELECT g.*
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND g
        JOIN d ON g.REPORT_DATE = d.REPORT_DATE
        WHERE g.BRAND_ID = 'favorite-daughter'
      ),
      mtd_plan AS (
        SELECT COALESCE(SUM(p.DEMAND_PLAN_AMT), 0) AS MTD_DEMAND_PLAN
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_SALES_PLAN p
        CROSS JOIN d
        WHERE p.BRAND_ID = 'favorite-daughter'
          AND p.PLAN_DATE BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      base AS (
        SELECT
          k.METRIC_SORT::number(9, 1)      AS METRIC_SORT,
          k.METRIC                         AS METRIC,
          k.YESTERDAY::number(38, 8)       AS YESTERDAY,
          k.SAME_DAY_LY::number(38, 8)     AS SAME_DAY_LY,
          k.MTD::number(38, 8)             AS MTD,
          k.LY_MTD::number(38, 8)          AS LY_MTD,
          k.TOTAL_MONTH_PLAN::number(38, 2) AS TOTAL_MONTH_PLAN,
          k.TO_GO_VS_PLAN::number(38, 2)   AS TO_GO_VS_PLAN,
          k.PCT_PLAN_ACHIEVED::number(38, 8) AS PCT_PLAN_ACHIEVED,
          k.REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_KPI_LONG_BRAND k
        JOIN d ON k.REPORT_DATE = d.REPORT_DATE
        WHERE k.BRAND_ID = 'favorite-daughter'
          AND k.METRIC_SORT <= 6
      ),
      plan_row AS (
        SELECT
          1.5::number(9, 1)                       AS METRIC_SORT,
          'Demand Plan'                           AS METRIC,
          g.Y_DEMAND_PLAN::number(38, 8)          AS YESTERDAY,
          NULL::number(38, 8)                     AS SAME_DAY_LY,
          mp.MTD_DEMAND_PLAN::number(38, 8)       AS MTD,
          NULL::number(38, 8)                     AS LY_MTD,
          g.TOTAL_MONTH_PLAN::number(38, 2)       AS TOTAL_MONTH_PLAN,
          NULL::number(38, 2)                     AS TO_GO_VS_PLAN,
          NULL::number(38, 8)                     AS PCT_PLAN_ACHIEVED,
          g.REPORT_DATE
        FROM g
        CROSS JOIN mtd_plan mp
      )
      SELECT * FROM base
      UNION ALL
      SELECT * FROM plan_row
      ORDER BY METRIC_SORT
  - id: src_favorite_daughter_top_sold
    name: Favorite Daughter — top 10 sold
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 10 sold" (yesterday, ecom).
      -- Units and dollars come straight from the validated pipeline table so the
      -- workbook and the existing QA workbook always agree; only the product image
      -- is joined on here.
      --
      -- Image resolution: order line -> Shopify product -> featuredImageUrl, keyed on
      -- style + color. Colour sits in a different slot of VARIANTTITLE per brand
      -- (FD/Hudson "colour / size", Joe's "size / COLOUR"), so the size-shaped part is
      -- discarded rather than assuming a position. This reproduces the image URLs on
      -- TB_SIGMA_TOP_STYLES_CURR exactly for all 30 current rows across the 3 brands.
      WITH d AS (
        SELECT MAX(DT_PT) AS DT_PT
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES
        WHERE BRAND_ID = 'favorite-daughter'
      ),
      items AS (
        SELECT i.BRANDID AS BRAND_ID, i.PRODUCTID, i.PRODUCTTITLE, i.VARIANTTITLE, i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'favorite-daughter'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'favorite-daughter'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      keyed AS (
        SELECT
          i.BRAND_ID,
          i.PRODUCTID,
          i.LOADTIMESTAMP,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2)))
            ELSE UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1)))
          END AS COLOR_K
        FROM items i
      ),
      img AS (
        SELECT k.BRAND_ID, k.STYLE_K, k.COLOR_K,
               MAX_BY(pr.IMAGE_URL, k.LOADTIMESTAMP) AS IMAGE_URL
        FROM keyed k
        JOIN prod pr ON pr.PRODUCT_ID = k.PRODUCTID AND pr.BRAND_ID = k.BRAND_ID
        WHERE pr.IMAGE_URL IS NOT NULL
        GROUP BY 1, 2, 3
      )
      SELECT
        t.RANK_IN_DAY,
        t.STYLE,
        t.COLOR,
        t.STYLE || ' — ' || t.COLOR AS STYLE_COLOR,
        t.QTY,
        t.DEMAND_AMT,
        img.IMAGE_URL,
        t.DT_PT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES t
      JOIN d ON t.DT_PT = d.DT_PT
      LEFT JOIN img
             ON img.BRAND_ID = t.BRAND_ID
            AND img.STYLE_K  = UPPER(TRIM(t.STYLE))
            AND img.COLOR_K  = UPPER(TRIM(t.COLOR))
      WHERE t.BRAND_ID = 'favorite-daughter'
        AND t.RANK_IN_DAY <= 10
      ORDER BY t.RANK_IN_DAY
  - id: src_favorite_daughter_top_returned
    name: Favorite Daughter — top 10 returned
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 10 returned" (yesterday, ecom).
      -- Shopify refunds only - Loop return rate / status is not in Snowflake yet
      -- (see TB_SIGMA_SOURCE_MAP).
      --
      -- The report date is taken from the glance table, i.e. the same day the rest of
      -- the email reports on - deliberately NOT the latest day that happens to have
      -- refund rows. Refunds lag the order feed, so keying off the refund table would
      -- silently pair one day's KPIs with an older day's returns. When there are no
      -- refunds for the report date this returns no rows, which is the email's
      -- "No rows for this day." state.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS DT_PT
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND
        WHERE BRAND_ID = 'favorite-daughter'
      ),
      items AS (
        SELECT i.BRANDID AS BRAND_ID, i.PRODUCTID, i.PRODUCTTITLE, i.VARIANTTITLE, i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'favorite-daughter'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'favorite-daughter'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      keyed AS (
        SELECT
          i.BRAND_ID,
          i.PRODUCTID,
          i.LOADTIMESTAMP,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2)))
            ELSE UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1)))
          END AS COLOR_K
        FROM items i
      ),
      img AS (
        SELECT k.BRAND_ID, k.STYLE_K, k.COLOR_K,
               MAX_BY(pr.IMAGE_URL, k.LOADTIMESTAMP) AS IMAGE_URL
        FROM keyed k
        JOIN prod pr ON pr.PRODUCT_ID = k.PRODUCTID AND pr.BRAND_ID = k.BRAND_ID
        WHERE pr.IMAGE_URL IS NOT NULL
        GROUP BY 1, 2, 3
      )
      SELECT
        r.RANK_IN_DAY,
        r.STYLE,
        r.COLOR,
        r.STYLE || ' — ' || r.COLOR AS STYLE_COLOR,
        r.QTY,
        img.IMAGE_URL,
        r.DT_PT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_TOP_RETURNS r
      JOIN d ON r.DT_PT = d.DT_PT
      LEFT JOIN img
             ON img.BRAND_ID = r.BRAND_ID
            AND img.STYLE_K  = UPPER(TRIM(r.STYLE))
            AND img.COLOR_K  = UPPER(TRIM(r.COLOR))
      WHERE r.BRAND_ID = 'favorite-daughter'
        AND r.RANK_IN_DAY <= 10
      ORDER BY r.RANK_IN_DAY
  - id: src_favorite_daughter_channel
    name: Favorite Daughter — retail + total DTC
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Retail + total DTC" (Favorite Daughter only).
      -- Grain: one row per channel - Ecom (website), Retail (POS / boutiques), Total DTC.
      -- Hudson and Joe's have no Shopify retail feed, so this returns no rows for them
      -- and the element is hidden on those pages.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_CHANNEL_FD
      )
      SELECT
        c.BRAND_LABEL,
        c.CHANNEL,
        c.Y_DEMAND,
        c.Y_ORDERS,
        c.MTD_DEMAND,
        c.REPORT_DATE,
        CASE c.CHANNEL
          WHEN 'Ecom (website)'            THEN 1
          WHEN 'Retail (POS / boutiques)'  THEN 2
          WHEN 'Total DTC'                 THEN 3
          ELSE 4
        END AS CHANNEL_SORT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_CHANNEL_FD c
      JOIN d ON c.REPORT_DATE = d.REPORT_DATE
      WHERE 'favorite-daughter' = 'favorite-daughter'
      ORDER BY CHANNEL_SORT
  - id: src_favorite_daughter_retail_top
    name: Favorite Daughter — top 5 MTD retail styles
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 5 MTD retail styles", one column per boutique
      -- (Favorite Daughter only).
      --
      -- Retail = Shopify orders tied to a physical location. Only the three
      -- boutiques are counted (Madison Avenue / Beverly Hills / Nashville); the
      -- "Shopify NY" and "Studio Services" locations are not storefronts and are
      -- excluded by the Boutique name filter. Returns no rows for the other brands,
      -- whose physical retail is on a separate platform.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_CHANNEL_FD
      ),
      retail_orders AS (
        SELECT
          r.ORDER_ID,
          r.BRAND_ID,
          o.RETAILLOCATIONNAME AS LOCATION_NAME
        FROM SANDBOX.SBX_RRAJASEKAR.VW_SIGMA_ORDERS_RETAIL r
        CROSS JOIN d
        JOIN (
          SELECT x.ID AS ORDER_ID, x.BRANDID AS BRAND_ID, x.RETAILLOCATIONNAME
          FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDERS_ADF x
          WHERE x.BRANDID = 'favorite-daughter'
          QUALIFY ROW_NUMBER() OVER (
            PARTITION BY x.BRANDID, x.ID
            ORDER BY x.UPDATEDAT DESC NULLS LAST, x.LOADTIMESTAMP DESC NULLS LAST
          ) = 1
        ) o ON o.ORDER_ID = r.ORDER_ID AND o.BRAND_ID = r.BRAND_ID
        WHERE r.BRAND_ID = 'favorite-daughter'
          AND o.RETAILLOCATIONNAME ILIKE '%Boutique%'
          AND r.DT_PT BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      items AS (
        SELECT
          i.ORDERID,
          i.BRANDID AS BRAND_ID,
          i.PRODUCTID,
          i.PRODUCTTITLE,
          i.VARIANTTITLE,
          i.QUANTITY,
          i.DISCOUNTEDUNITPRICE,
          i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'favorite-daughter'
          -- Gift cards are not a style. Left in, a $150 card outsells every garment
          -- in the boutique ranking.
          AND COALESCE(i.ISGIFTCARD, FALSE) = FALSE
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'favorite-daughter'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      lines AS (
        SELECT
          ro.LOCATION_NAME,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          i.PRODUCTTITLE AS STYLE,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2))
            ELSE TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))
          END AS COLOR,
          i.PRODUCTID,
          i.QUANTITY,
          COALESCE(i.DISCOUNTEDUNITPRICE, 0) * COALESCE(i.QUANTITY, 0) AS LINE_DEMAND,
          i.LOADTIMESTAMP
        FROM retail_orders ro
        JOIN items i ON i.ORDERID = ro.ORDER_ID AND i.BRAND_ID = ro.BRAND_ID
      ),
      agg AS (
        SELECT
          l.LOCATION_NAME,
          l.STYLE,
          l.COLOR,
          SUM(l.QUANTITY)    AS QTY,
          SUM(l.LINE_DEMAND) AS DEMAND_AMT,
          MAX_BY(pr.IMAGE_URL, l.LOADTIMESTAMP) AS IMAGE_URL
        FROM lines l
        LEFT JOIN prod pr ON pr.PRODUCT_ID = l.PRODUCTID
        GROUP BY 1, 2, 3
      )
      SELECT
        UPPER(REPLACE(a.LOCATION_NAME, ' Boutique', '')) AS LOCATION_LABEL,
        a.LOCATION_NAME,
        a.STYLE,
        a.COLOR,
        a.STYLE || ' — ' || a.COLOR AS STYLE_COLOR,
        a.QTY,
        a.DEMAND_AMT,
        a.IMAGE_URL,
        ROW_NUMBER() OVER (
          PARTITION BY a.LOCATION_NAME
          ORDER BY a.QTY DESC NULLS LAST, a.DEMAND_AMT DESC NULLS LAST
        ) AS RANK_IN_LOCATION
      FROM agg a
      QUALIFY RANK_IN_LOCATION <= 5
      ORDER BY a.LOCATION_NAME, RANK_IN_LOCATION
  - id: src_joes_header
    name: Joe's Jeans — header
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: brand header band + narrative paragraph + promo/email callout
      --               + the four KPI tiles + the data-freshness footnotes.
      -- Grain: exactly one row (brand x latest complete report date).
      --
      -- This block also owns the *copy*: the narrative sentences, the promo lines and
      -- the compact money/percent strings ("$12.8k", "-31%") are built here rather
      -- than assembled from formula chips in the workbook. Two reasons: the sentences
      -- stay byte-identical to the mails they replace, and the em-dash placeholder for
      -- a missing plan or promo is decided in one place instead of per element.
      --
      -- Report date is derived, not passed in: the send always shows the latest day
      -- present in TB_SIGMA_QA_GLANCE_BRAND for the brand, which is what the email's
      -- "ADF last complete day is <date> - showing that day until the pipeline
      -- catches up" note describes.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND
        WHERE BRAND_ID = 'joes-jeans'
      ),
      g AS (
        SELECT g.*
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND g
        JOIN d ON g.REPORT_DATE = d.REPORT_DATE
        WHERE g.BRAND_ID = 'joes-jeans'
      ),
      cfg AS (
        SELECT SITE_NOTE, HAS_SHOPIFY_RETAIL
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_SIGMA_BRAND_CONFIG
        WHERE BRAND_ID = 'joes-jeans'
      ),
      -- Month-to-date plan: summed from the daily plan rows up to the report date.
      -- The month total on the glance table is the full-month plan.
      mtd_plan AS (
        SELECT COALESCE(SUM(p.DEMAND_PLAN_AMT), 0) AS MTD_DEMAND_PLAN
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_SALES_PLAN p
        CROSS JOIN d
        WHERE p.BRAND_ID = 'joes-jeans'
          AND p.PLAN_DATE BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      promo AS (
        SELECT MAX(pr.PROMO_TEXT) AS PROMO_TEXT,
               MAX(pr.EMAIL_TEXT)  AS EMAIL_TEXT
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_PROMO pr
        CROSS JOIN d
        WHERE pr.BRAND_ID = 'joes-jeans'
          AND pr.PROMO_DATE = d.REPORT_DATE
      ),
      -- Latest record per Shopify order, so TOTALDISCOUNT is read off the same row
      -- the demand figures come from (mirrors VW_SIGMA_LATEST_ORDERS).
      orders_latest AS (
        SELECT o.ID AS ORDER_ID, o.BRANDID AS BRAND_ID, o.TOTALDISCOUNT
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDERS_ADF o
        WHERE o.BRANDID = 'joes-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY o.BRANDID, o.ID
          ORDER BY o.UPDATEDAT DESC NULLS LAST, o.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      -- "Promo purchase (discounts applied)" - discount dollars and the number of
      -- discounted orders, restricted to the same in-scope ecom orders as demand.
      promo_purchase AS (
        SELECT COALESCE(SUM(ol.TOTALDISCOUNT), 0)                          AS PROMO_PURCHASE_AMT,
               COUNT(DISTINCT IFF(ol.TOTALDISCOUNT > 0, f.ORDER_ID, NULL)) AS PROMO_PURCHASE_ORDERS
        FROM SANDBOX.SBX_RRAJASEKAR.VW_SIGMA_ORDERS_FILTERED f
        JOIN d ON f.DT_PT = d.REPORT_DATE
        LEFT JOIN orders_latest ol
               ON ol.ORDER_ID = f.ORDER_ID
              AND ol.BRAND_ID = f.BRAND_ID
        WHERE f.BRAND_ID = 'joes-jeans'
      ),
      -- Drives the two data-freshness footnotes above the top-10 block: whether any
      -- Shopify refunds landed for the report date, and which day the order feed is
      -- actually complete through.
      refunds AS (
        SELECT COUNT(*) AS REFUND_ROWS_TODAY
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_TOP_RETURNS r
        CROSS JOIN d
        WHERE r.BRAND_ID = 'joes-jeans'
          AND r.DT_PT = d.REPORT_DATE
      ),
      feed AS (
        SELECT MAX(DT_PT) AS LAST_COMPLETE_DAY
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES
        WHERE BRAND_ID = 'joes-jeans'
      ),
      -- Yesterday's retail contribution, quoted in the FD note above the KPI tiles.
      retail AS (
        SELECT MAX(IFF(c.CHANNEL = 'Retail (POS / boutiques)', c.Y_DEMAND, NULL)) AS RETAIL_Y_DEMAND,
               MAX(IFF(c.CHANNEL = 'Retail (POS / boutiques)', c.Y_ORDERS, NULL)) AS RETAIL_Y_ORDERS
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_CHANNEL_FD c
        CROSS JOIN d
        WHERE c.REPORT_DATE = d.REPORT_DATE
      ),
      raw AS (
        SELECT
          g.BRAND_ID,
          g.BRAND_LABEL,
          cfg.SITE_NOTE,
          cfg.HAS_SHOPIFY_RETAIL,
          g.REPORT_DATE,
          DATEADD('day', -364, g.REPORT_DATE) AS SAME_DAY_LY_DATE,
          g.YESTERDAY_DEMAND,
          g.Y_DEMAND_PLAN,
          g.PCT_YEST_VS_PLAN,
          g.SAME_DAY_LY_DEMAND,
          g.PCT_YEST_VS_LY,
          g.MTD_DEMAND,
          mp.MTD_DEMAND_PLAN,
          g.TOTAL_MONTH_PLAN,
          g.PCT_MTD_VS_PLAN,
          g.LY_MTD_DEMAND,
          g.PCT_MTD_VS_LY,
          g.PCT_PLAN_ACHIEVED,
          g.TO_GO_VS_PLAN,
          promo.PROMO_TEXT,
          promo.EMAIL_TEXT,
          pp.PROMO_PURCHASE_AMT,
          pp.PROMO_PURCHASE_ORDERS,
          rf.REFUND_ROWS_TODAY,
          fd.LAST_COMPLETE_DAY,
          rt.RETAIL_Y_DEMAND,
          rt.RETAIL_Y_ORDERS,
          g.AS_OF_DATE
        FROM g
        CROSS JOIN cfg
        CROSS JOIN mtd_plan mp
        CROSS JOIN promo
        CROSS JOIN promo_purchase pp
        CROSS JOIN refunds rf
        CROSS JOIN feed fd
        CROSS JOIN retail rt
      ),
      -- Display strings. Money is compact ($12.8k / $1.2m) the way the mail prints
      -- it; percentages are whole numbers carrying an explicit sign; anything missing
      -- becomes an em dash rather than "0" or "null".
      fmt AS (
        SELECT
          r.*,
          DECODE(DAYOFWEEK(r.REPORT_DATE), 0,'Sunday',1,'Monday',2,'Tuesday',3,'Wednesday',
                 4,'Thursday',5,'Friday',6,'Saturday')
            || ', ' || MONTH(r.REPORT_DATE) || '/' || DAY(r.REPORT_DATE)
            || '/' || RIGHT(YEAR(r.REPORT_DATE)::string, 2)                       AS REPORT_DATE_LABEL,
          DECODE(DAYOFWEEK(r.SAME_DAY_LY_DATE), 0,'Sunday',1,'Monday',2,'Tuesday',3,'Wednesday',
                 4,'Thursday',5,'Friday',6,'Saturday')
            || ', ' || MONTH(r.SAME_DAY_LY_DATE) || '/' || DAY(r.SAME_DAY_LY_DATE)
            || '/' || RIGHT(YEAR(r.SAME_DAY_LY_DATE)::string, 2)                  AS SAME_DAY_LY_LABEL,

          IFF(r.YESTERDAY_DEMAND IS NULL, '—', IFF(r.YESTERDAY_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.YESTERDAY_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.YESTERDAY_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.YESTERDAY_DEMAND), 0)) END)   AS YESTERDAY_DEMAND_FMT,
          IFF(r.Y_DEMAND_PLAN IS NULL, '—', IFF(r.Y_DEMAND_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.Y_DEMAND_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.Y_DEMAND_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.Y_DEMAND_PLAN), 0)) END)      AS Y_DEMAND_PLAN_FMT,
          IFF(r.SAME_DAY_LY_DEMAND IS NULL, '—', IFF(r.SAME_DAY_LY_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.SAME_DAY_LY_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.SAME_DAY_LY_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.SAME_DAY_LY_DEMAND), 0)) END) AS SAME_DAY_LY_DEMAND_FMT,
          IFF(r.MTD_DEMAND IS NULL, '—', IFF(r.MTD_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.MTD_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.MTD_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND), 0)) END)         AS MTD_DEMAND_FMT,
          IFF(r.MTD_DEMAND_PLAN IS NULL, '—', IFF(r.MTD_DEMAND_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.MTD_DEMAND_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.MTD_DEMAND_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.MTD_DEMAND_PLAN), 0)) END)    AS MTD_DEMAND_PLAN_FMT,
          IFF(r.TOTAL_MONTH_PLAN IS NULL, '—', IFF(r.TOTAL_MONTH_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.TOTAL_MONTH_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.TOTAL_MONTH_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.TOTAL_MONTH_PLAN), 0)) END)   AS TOTAL_MONTH_PLAN_FMT,
          IFF(r.LY_MTD_DEMAND IS NULL, '—', IFF(r.LY_MTD_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.LY_MTD_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.LY_MTD_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.LY_MTD_DEMAND), 0)) END)      AS LY_MTD_DEMAND_FMT,
          IFF(r.TO_GO_VS_PLAN IS NULL, '—', IFF(r.TO_GO_VS_PLAN < 0, '-', '') || '$' || CASE WHEN ABS(r.TO_GO_VS_PLAN) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN) / 1000000.0, 1)) || 'm' WHEN ABS(r.TO_GO_VS_PLAN) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.TO_GO_VS_PLAN), 0)) END)      AS TO_GO_VS_PLAN_FMT,
          IFF(r.PROMO_PURCHASE_AMT IS NULL, '—', IFF(r.PROMO_PURCHASE_AMT < 0, '-', '') || '$' || CASE WHEN ABS(r.PROMO_PURCHASE_AMT) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT) / 1000000.0, 1)) || 'm' WHEN ABS(r.PROMO_PURCHASE_AMT) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.PROMO_PURCHASE_AMT), 0)) END) AS PROMO_PURCHASE_AMT_FMT,
          IFF(r.RETAIL_Y_DEMAND IS NULL, '—', IFF(r.RETAIL_Y_DEMAND < 0, '-', '') || '$' || CASE WHEN ABS(r.RETAIL_Y_DEMAND) >= 1000000 THEN TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND) / 1000000.0, 1)) || 'm' WHEN ABS(r.RETAIL_Y_DEMAND) >= 1000 THEN TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND) / 1000.0, 1)) || 'k' ELSE TO_VARCHAR(ROUND(ABS(r.RETAIL_Y_DEMAND), 0)) END)    AS RETAIL_Y_DEMAND_FMT,

          IFF(r.PCT_YEST_VS_PLAN IS NULL, '—', IFF(r.PCT_YEST_VS_PLAN >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_YEST_VS_PLAN) * 100, 0)) || '%')     AS PCT_YEST_VS_PLAN_FMT,
          IFF(r.PCT_YEST_VS_LY IS NULL, '—', IFF(r.PCT_YEST_VS_LY >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_YEST_VS_LY) * 100, 0)) || '%')       AS PCT_YEST_VS_LY_FMT,
          IFF(r.PCT_MTD_VS_PLAN IS NULL, '—', IFF(r.PCT_MTD_VS_PLAN >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_MTD_VS_PLAN) * 100, 0)) || '%')      AS PCT_MTD_VS_PLAN_FMT,
          IFF(r.PCT_MTD_VS_LY IS NULL, '—', IFF(r.PCT_MTD_VS_LY >= 0, '+', '-') || TO_VARCHAR(ROUND(ABS(r.PCT_MTD_VS_LY) * 100, 0)) || '%')        AS PCT_MTD_VS_LY_FMT,
          -- Unsigned: "80%" of plan achieved, not "+80%".
          IFF(r.PCT_PLAN_ACHIEVED IS NULL, '—', TO_VARCHAR(ROUND(r.PCT_PLAN_ACHIEVED * 100, 0)) || '%') AS PCT_PLAN_ACHIEVED_FMT
        FROM raw r
      )
      SELECT
        f.*,

        -- Header band
        'Today = ' || f.REPORT_DATE_LABEL                                          AS HEADER_TODAY_LINE,
        'Same Day LY = ' || f.SAME_DAY_LY_LABEL || ' (same weekday)'               AS HEADER_LY_LINE,

        -- Narrative paragraph
        'Yesterday''s ecom demand was ' || f.YESTERDAY_DEMAND_FMT
          || ' vs plan ' || f.Y_DEMAND_PLAN_FMT
          || ' (' || f.PCT_YEST_VS_PLAN_FMT || ') and '
          || f.PCT_YEST_VS_LY_FMT || ' to same-day LY.'                            AS NARRATIVE_YESTERDAY,
        'MTD ecom demand is ' || f.MTD_DEMAND_FMT
          || ' vs MTD plan ' || f.MTD_DEMAND_PLAN_FMT
          || ' / month plan ' || f.TOTAL_MONTH_PLAN_FMT
          || ' (' || f.PCT_MTD_VS_PLAN_FMT || ' to MTD plan, '
          || f.PCT_MTD_VS_LY_FMT || ' to LY MTD).'                                 AS NARRATIVE_MTD,

        -- The small print under each of the four tiles, e.g.
        -- "$12.8k vs $14.3k plan" / "vs $18.5k" / "vs $49.4k LY MTD".
        f.YESTERDAY_DEMAND_FMT || ' vs ' || f.Y_DEMAND_PLAN_FMT || ' plan'          AS TILE_Y_PLAN_SUB,
        'vs ' || f.SAME_DAY_LY_DEMAND_FMT                                          AS TILE_Y_LY_SUB,
        f.MTD_DEMAND_FMT || ' vs ' || f.MTD_DEMAND_PLAN_FMT
          || ' MTD plan (month ' || f.TOTAL_MONTH_PLAN_FMT || ')'                   AS TILE_MTD_PLAN_SUB,
        'vs ' || f.LY_MTD_DEMAND_FMT || ' LY MTD'                                  AS TILE_MTD_LY_SUB,

        -- Promo & email callout
        IFF(COALESCE(TRIM(f.PROMO_TEXT), '') = '',
            '— (none on Marketing Calendar for this day)',
            f.PROMO_TEXT)                                                          AS PROMO_LINE,
        IFF(COALESCE(TRIM(f.EMAIL_TEXT), '') = '',
            '— (none on Marketing Calendar for this day)',
            f.EMAIL_TEXT)                                                          AS EMAIL_LINE,
        f.PROMO_PURCHASE_AMT_FMT || ' across ' || f.PROMO_PURCHASE_ORDERS
          || ' orders (Shopify TOTALDISCOUNT)'                                     AS PROMO_PURCHASE_LINE,

        -- FD-only note above the KPI tiles
        IFF(f.HAS_SHOPIFY_RETAIL AND f.RETAIL_Y_DEMAND IS NOT NULL,
            'Retail boutiques added ' || f.RETAIL_Y_DEMAND_FMT || ' / '
              || f.RETAIL_Y_ORDERS || ' orders yesterday — see Retail + Total DTC '
              || 'below. Not included in the ecom figures above.',
            NULL)                                                                  AS RETAIL_NOTE_LINE,

        -- Data-freshness footnotes above the top-10 block
        IFF(f.REFUND_ROWS_TODAY = 0,
            'No Shopify refunds in Snowflake for yesterday ('
              || f.REPORT_DATE::string || ' PT).',
            NULL)                                                                  AS REFUND_NOTE_LINE,
        'ADF last complete day is ' || f.LAST_COMPLETE_DAY::string
          || ' — showing that day until the pipeline catches up.'                  AS FEED_NOTE_LINE,
        'As of ' || f.AS_OF_DATE::string || ' PT.'                                 AS AS_OF_LINE
      FROM fmt f
  - id: src_joes_perf
    name: Joe's Jeans — performance grid
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Performance detail - ecom only".
      -- Grain: one row per KPI, in the email's row order:
      --   Demand Sales, Demand Plan, Orders, Units, UPT, AOV, AUR.
      --
      -- Two shape corrections against TB_SIGMA_QA_KPI_LONG_BRAND:
      --   * It has no "Demand Plan" row, so that row is assembled from the daily plan
      --     table (yesterday plan, MTD plan, full-month plan) the way the email prints
      --     it - LY columns intentionally blank.
      --   * It carries seven metrics that are not in Snowflake yet (Media Spend,
      --     CAC/CPO, Traffic, CVR, Net Sales, Margin $, Margin %) and would render as
      --     seven empty rows. They are excluded here; the email covers them in the
      --     "KPI additions in progress" footnote instead.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_KPI_LONG_BRAND
        WHERE BRAND_ID = 'joes-jeans'
      ),
      g AS (
        SELECT g.*
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND g
        JOIN d ON g.REPORT_DATE = d.REPORT_DATE
        WHERE g.BRAND_ID = 'joes-jeans'
      ),
      mtd_plan AS (
        SELECT COALESCE(SUM(p.DEMAND_PLAN_AMT), 0) AS MTD_DEMAND_PLAN
        FROM SANDBOX.SBX_RRAJASEKAR.ECOM_DAILY_SALES_PLAN p
        CROSS JOIN d
        WHERE p.BRAND_ID = 'joes-jeans'
          AND p.PLAN_DATE BETWEEN DATE_TRUNC('month', d.REPORT_DATE) AND d.REPORT_DATE
      ),
      base AS (
        SELECT
          k.METRIC_SORT::number(9, 1)      AS METRIC_SORT,
          k.METRIC                         AS METRIC,
          k.YESTERDAY::number(38, 8)       AS YESTERDAY,
          k.SAME_DAY_LY::number(38, 8)     AS SAME_DAY_LY,
          k.MTD::number(38, 8)             AS MTD,
          k.LY_MTD::number(38, 8)          AS LY_MTD,
          k.TOTAL_MONTH_PLAN::number(38, 2) AS TOTAL_MONTH_PLAN,
          k.TO_GO_VS_PLAN::number(38, 2)   AS TO_GO_VS_PLAN,
          k.PCT_PLAN_ACHIEVED::number(38, 8) AS PCT_PLAN_ACHIEVED,
          k.REPORT_DATE
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_KPI_LONG_BRAND k
        JOIN d ON k.REPORT_DATE = d.REPORT_DATE
        WHERE k.BRAND_ID = 'joes-jeans'
          AND k.METRIC_SORT <= 6
      ),
      plan_row AS (
        SELECT
          1.5::number(9, 1)                       AS METRIC_SORT,
          'Demand Plan'                           AS METRIC,
          g.Y_DEMAND_PLAN::number(38, 8)          AS YESTERDAY,
          NULL::number(38, 8)                     AS SAME_DAY_LY,
          mp.MTD_DEMAND_PLAN::number(38, 8)       AS MTD,
          NULL::number(38, 8)                     AS LY_MTD,
          g.TOTAL_MONTH_PLAN::number(38, 2)       AS TOTAL_MONTH_PLAN,
          NULL::number(38, 2)                     AS TO_GO_VS_PLAN,
          NULL::number(38, 8)                     AS PCT_PLAN_ACHIEVED,
          g.REPORT_DATE
        FROM g
        CROSS JOIN mtd_plan mp
      )
      SELECT * FROM base
      UNION ALL
      SELECT * FROM plan_row
      ORDER BY METRIC_SORT
  - id: src_joes_top_sold
    name: Joe's Jeans — top 10 sold
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 10 sold" (yesterday, ecom).
      -- Units and dollars come straight from the validated pipeline table so the
      -- workbook and the existing QA workbook always agree; only the product image
      -- is joined on here.
      --
      -- Image resolution: order line -> Shopify product -> featuredImageUrl, keyed on
      -- style + color. Colour sits in a different slot of VARIANTTITLE per brand
      -- (FD/Hudson "colour / size", Joe's "size / COLOUR"), so the size-shaped part is
      -- discarded rather than assuming a position. This reproduces the image URLs on
      -- TB_SIGMA_TOP_STYLES_CURR exactly for all 30 current rows across the 3 brands.
      WITH d AS (
        SELECT MAX(DT_PT) AS DT_PT
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES
        WHERE BRAND_ID = 'joes-jeans'
      ),
      items AS (
        SELECT i.BRANDID AS BRAND_ID, i.PRODUCTID, i.PRODUCTTITLE, i.VARIANTTITLE, i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'joes-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'joes-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      keyed AS (
        SELECT
          i.BRAND_ID,
          i.PRODUCTID,
          i.LOADTIMESTAMP,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2)))
            ELSE UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1)))
          END AS COLOR_K
        FROM items i
      ),
      img AS (
        SELECT k.BRAND_ID, k.STYLE_K, k.COLOR_K,
               MAX_BY(pr.IMAGE_URL, k.LOADTIMESTAMP) AS IMAGE_URL
        FROM keyed k
        JOIN prod pr ON pr.PRODUCT_ID = k.PRODUCTID AND pr.BRAND_ID = k.BRAND_ID
        WHERE pr.IMAGE_URL IS NOT NULL
        GROUP BY 1, 2, 3
      )
      SELECT
        t.RANK_IN_DAY,
        t.STYLE,
        t.COLOR,
        t.STYLE || ' — ' || t.COLOR AS STYLE_COLOR,
        t.QTY,
        t.DEMAND_AMT,
        img.IMAGE_URL,
        t.DT_PT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_DAILY_TOP_STYLES t
      JOIN d ON t.DT_PT = d.DT_PT
      LEFT JOIN img
             ON img.BRAND_ID = t.BRAND_ID
            AND img.STYLE_K  = UPPER(TRIM(t.STYLE))
            AND img.COLOR_K  = UPPER(TRIM(t.COLOR))
      WHERE t.BRAND_ID = 'joes-jeans'
        AND t.RANK_IN_DAY <= 10
      ORDER BY t.RANK_IN_DAY
  - id: src_joes_top_returned
    name: Joe's Jeans — top 10 returned
    type: sql
    connectionId: 82dc9446-e21c-4484-987d-79b52a490e2a
    sql: |
      -- Email block: "Top 10 returned" (yesterday, ecom).
      -- Shopify refunds only - Loop return rate / status is not in Snowflake yet
      -- (see TB_SIGMA_SOURCE_MAP).
      --
      -- The report date is taken from the glance table, i.e. the same day the rest of
      -- the email reports on - deliberately NOT the latest day that happens to have
      -- refund rows. Refunds lag the order feed, so keying off the refund table would
      -- silently pair one day's KPIs with an older day's returns. When there are no
      -- refunds for the report date this returns no rows, which is the email's
      -- "No rows for this day." state.
      WITH d AS (
        SELECT MAX(REPORT_DATE) AS DT_PT
        FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_QA_GLANCE_BRAND
        WHERE BRAND_ID = 'joes-jeans'
      ),
      items AS (
        SELECT i.BRANDID AS BRAND_ID, i.PRODUCTID, i.PRODUCTTITLE, i.VARIANTTITLE, i.LOADTIMESTAMP
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_ORDER_ITEMS_ADF i
        WHERE i.BRANDID = 'joes-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY i.BRANDID, i.LINEITEMID
          ORDER BY i.LOADTIMESTAMP DESC NULLS LAST
        ) = 1
      ),
      prod AS (
        SELECT p."brandId" AS BRAND_ID, p."productId" AS PRODUCT_ID, p."featuredImageUrl" AS IMAGE_URL
        FROM SHOPIFY_APP.DEV_BRONZE.SHOPIFY_PRODUCT_ADF p
        WHERE p."brandId" = 'joes-jeans'
        QUALIFY ROW_NUMBER() OVER (
          PARTITION BY p."brandId", p."productId"
          ORDER BY p."loadTimestamp" DESC NULLS LAST
        ) = 1
      ),
      keyed AS (
        SELECT
          i.BRAND_ID,
          i.PRODUCTID,
          i.LOADTIMESTAMP,
          UPPER(TRIM(i.PRODUCTTITLE)) AS STYLE_K,
          CASE
            WHEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))) = '' THEN ''
            WHEN REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^[0-9]{1,3}([./-][0-9]{1,3})?$')
              OR REGEXP_LIKE(UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1))), '^(XXS|XS|S|M|L|XL|XXL|XXXL|1X|2X|3X|4X|OS|ONE SIZE|O/S)$')
            THEN UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 2)))
            ELSE UPPER(TRIM(SPLIT_PART(i.VARIANTTITLE, '/', 1)))
          END AS COLOR_K
        FROM items i
      ),
      img AS (
        SELECT k.BRAND_ID, k.STYLE_K, k.COLOR_K,
               MAX_BY(pr.IMAGE_URL, k.LOADTIMESTAMP) AS IMAGE_URL
        FROM keyed k
        JOIN prod pr ON pr.PRODUCT_ID = k.PRODUCTID AND pr.BRAND_ID = k.BRAND_ID
        WHERE pr.IMAGE_URL IS NOT NULL
        GROUP BY 1, 2, 3
      )
      SELECT
        r.RANK_IN_DAY,
        r.STYLE,
        r.COLOR,
        r.STYLE || ' — ' || r.COLOR AS STYLE_COLOR,
        r.QTY,
        img.IMAGE_URL,
        r.DT_PT
      FROM SANDBOX.SBX_RRAJASEKAR.TB_SIGMA_TOP_RETURNS r
      JOIN d ON r.DT_PT = d.DT_PT
      LEFT JOIN img
             ON img.BRAND_ID = r.BRAND_ID
            AND img.STYLE_K  = UPPER(TRIM(r.STYLE))
            AND img.COLOR_K  = UPPER(TRIM(r.COLOR))
      WHERE r.BRAND_ID = 'joes-jeans'
        AND r.RANK_IN_DAY <= 10
      ORDER BY r.RANK_IN_DAY
